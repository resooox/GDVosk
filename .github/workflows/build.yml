name: Build GDVosk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: universal
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      - name: Build release
        run: scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }} -j4

      - name: Build debug
        run: scons platform=${{ matrix.platform }} target=template_debug arch=${{ matrix.arch }} -j4

      - name: Fix libvosk path (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd demo/addons/gdvosk/macos
          for f in libgdvosk.*; do
            echo "== $f"
            otool -L "$f"
            install_name_tool -change libvosk.dylib @loader_path/libvosk.dylib "$f"
          done

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: gdvosk-${{ matrix.platform }}
          path: demo/addons/gdvosk/${{ matrix.platform }}
